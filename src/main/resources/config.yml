# xgxhtask 每日任务插件配置文件
# 作者: 雪糕小豪

# 允许使用任务的世界列表
allowed-worlds:
  - "world"
  - "world_nether"
  - "world_the_end"

# 自动保存设置
auto-save:
  # 是否开启自动保存
  enabled: true
  # 自动保存间隔（分钟）
  interval-minutes: 5

# 任务重置设置
task-reset:
  # 是否开启定时重置
  enabled: false
  # 重置间隔（分钟）
  interval-minutes: 1440
  # 重置时间说明: 1440分钟 = 24小时 = 1天

# 每日任务设置
daily-tasks:
  # 每日显示任务数量
  count: 20
  # 是否每日随机任务
  random-enabled: true

# 提醒设置
notifications:
  # 玩家加入时是否提醒任务状态
  join-reminder: true
  # 任务完成时是否自动领取奖励
  auto-claim: true
  # 任务完成时是否发送提醒
  task-complete-notify: true
  # 任务完成时是否播放音效
  task-complete-sound: true

# 自定义提示语
messages:
  # 玩家加入提醒
  join:
    title: ""
    subtitle: "§6§l     §e§l每日任务状态 §6§l"
    footer: ""
    total-tasks: "§7今日共有 §e%total% §7个任务"
    completed: "§7已完成: §a%completed% §7个"
    claimed: "§7已领取: §e%claimed% §7个"
    remaining: "§e§l还有 §c%remaining% §e§l个任务等你完成！"
    unclaimed: "§a§l有 §e%unclaimed% §a§l个任务奖励待领取！"
    help: "§7输入 §e/task 查看 §7查看详情"
    menu-help: "§7输入 §e/task 菜单 §7打开任务界面"
    separator: ""

  # 任务完成提醒
  task-complete:
    header: ""
    message: "§a§l✦ 任务完成！§e%task%"
    description: "§7%description%"
    reward: "§7奖励: §6%reward% 金币"
    footer: ""
    auto-claim: "§a§l✓ 奖励已自动领取！§6+%reward% 金币"

  # 任务重置提醒
  task-reset:
    message: "§a§l✦ 每日任务已重置！新的任务等待你完成！"

  # 任务查看
  task-view:
    title: "§6§l===== 每日任务进度 ====="
    format: "%status% %name% §7- §f%progress%/%amount% §7(§a%reward%金币§7)"
    status-claimed: "§a[已领取]"
    status-completed: "§e[可领取]"
    status-progress: "§c[进行中]"
    footer: "§6§l========================"

  # 错误提示
  errors:
    no-permission: "§c你没有权限使用此命令！"
    task-not-exist: "§c任务不存在！"
    task-not-completed: "§c任务尚未完成！"
    reward-already-claimed: "§c奖励已经领取过了！"
    claim-failed: "§c领取奖励失败！"
    player-only: "§c只有玩家可以使用此命令！"

