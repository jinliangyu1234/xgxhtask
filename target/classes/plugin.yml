name: xgxhtask
version: '1.0.0'
main: com.xgxh.XgxhPlugin
api-version: '1.21'
description: 每日任务插件
author: 雪糕小豪
depend:
  - Vault
softdepend:
  - PlaceholderAPI
commands:
  task:
    description: 每日任务主命令
    usage: /task [菜单|查看|领取|重置]
    aliases: [rw, xgxh]
permissions:
  xgxh.use:
    description: 使用任务插件
    default: true
  xgxh.admin:
    description: 管理任务插件
    default: op
